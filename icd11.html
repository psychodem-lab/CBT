<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="cbt.png" />
    <title>ICD-11 Asystent Diagnostyczny - Zdrowie Psychiczne</title>
    <style>
        :root {
            --primary-color: #1b4332;
            --secondary-color: #2d6a4f;
            --bg-color: #f7f3ec;
            --card-bg: #fffdf9;
            --text-main: #1b4332;
            --text-muted: #556b2f;
            --border-color: #d8c3a5;
            --success-bg: #ecfdf5;
            --success-text: #065f46;
            --danger-bg: #fef2f2;
            --danger-text: #991b1b;
            --accent: #52b788;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e9e1d4 0.75px, transparent 0.75px), radial-gradient(#e9e1d4 0.75px, var(--bg-color) 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Panel boczny (Drzewo kategorii i wyszukiwarka) */
        .sidebar {
            width: 380px;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(27, 67, 50, 0.05);
        }

        .logo-wrapper {
            text-align: center;
            padding: 16px 0 10px 0;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
        }
        .logo-wrapper a {
            text-decoration: none;
            border: none;
        }
        .logo-wrapper img {
            max-height: 70px;
            width: auto;
            display: inline-block;
        }

        .search-box {
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            background: #fff;
            color: var(--text-main);
        }
        .search-input:focus { border-color: var(--primary-color); }

        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* Drzewo akordeonowe ICD-11 */
        .tree-category {
            margin-bottom: 6px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fff;
            overflow: hidden;
        }
        .tree-category-header {
            padding: 10px 12px;
            background: #f4efe6;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--primary-color);
            transition: background 0.2s;
        }
        .tree-category-header:hover {
            background: #eae2d5;
        }
        .tree-category-body {
            padding: 6px 0 6px 12px;
            display: none;
            background: #fffdf9;
            border-top: 1px solid var(--border-color);
        }
        .tree-category.open .tree-category-body {
            display: block;
        }
        .tree-category.open .toggle-icon {
            transform: rotate(90deg);
        }
        .toggle-icon {
            font-size: 0.75rem;
            transition: transform 0.2s;
            color: var(--secondary-color);
        }

        .disorder-item {
            padding: 8px 10px;
            margin: 2px 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            border-left: 3px solid transparent;
        }
        .disorder-item:hover { background: #f4efe6; }
        .disorder-item.active {
            background: #e8f5e9;
            border-left-color: var(--primary-color);
        }
        .item-code {
            font-weight: bold;
            font-size: 0.8rem;
            color: var(--secondary-color);
        }
        .item-title {
            font-size: 0.9rem;
            margin-top: 2px;
            font-weight: 500;
            color: var(--text-main);
        }

        /* Obszar główny */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 30px;
        }
        .header-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.04);
        }
        .disorder-header-title {
            margin: 0 0 8px 0;
            font-size: 1.6rem;
            color: var(--primary-color);
        }
        .disorder-header-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Sekcje kryteriów */
        .section-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.04);
        }
        .section-title {
            margin: 0 0 6px 0;
            font-size: 1.1rem;
            color: var(--primary-color);
            font-weight: 600;
        }
        .section-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            border: 1px solid transparent;
        }
        .checkbox-label:hover { background: #f4efe6; border-color: var(--border-color); }
        .checkbox-label input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        /* Panel dolny podsumowania */
        .footer-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.04);
        }
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .status-badge.complete {
            background: var(--success-bg);
            color: var(--success-text);
        }
        .status-badge.incomplete {
            background: var(--danger-bg);
            color: var(--danger-text);
        }
        .btn-export {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-export:hover { background: var(--secondary-color); }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Panel boczny z logo, wyszukiwarką i drzewem kategorii ICD-11 -->
    <div class="sidebar">
        <div class="logo-wrapper">
            <a href="index.html" title="Powrót do strony głównej">
                <img src="logo.png" alt="Logo CBT">
            </a>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Szukaj po kodzie lub nazwie...">
        </div>
        <div id="treeContainer" class="tree-container"></div>
    </div>

    <!-- Obszar główny z formularzem kryteriów -->
    <div class="main-content">
        <a href="index.html" class="back-link">&larr; Powrót do menu głównego</a>
        <div class="header-card">
            <h1 id="disorderTitle" class="disorder-header-title">Wybierz zaburzenie psychiczne z drzewa</h1>
            <div id="disorderMeta" class="disorder-header-meta">Wybierz jednostkę diagnostyczną z lewego panelu (zgodnie z oficjalną klasyfikacją ICD-11 MMS, Rozdział 06: Zdrowie Psychiczne), aby zweryfikować kryteria diagnostyczne.</div>
        </div>

        <div id="criteriaContainer"></div>

        <div class="footer-panel" id="footerPanel" style="display: none;">
            <div>
                <span id="statusBadge" class="status-badge incomplete">Kryteria niespełnione</span>
            </div>
            <button class="btn-export" onclick="exportSummary()">Skopiuj podsumowanie do notatki</button>
        </div>
    </div>

<script>

            {

        let currentDisorder = null;

        function renderTree(filterText = "") {
            const container = document.getElementById("treeContainer");
            container.innerHTML = "";

            icd11Categories.forEach(cat => {
                // Filtruj zaburzenia w kategorii
                const matchingDisorders = icd11Database.filter(d => 
                    cat.codes.includes(d.code) && 
                    (d.title.toLowerCase().includes(filterText.toLowerCase()) || d.code.toLowerCase().includes(filterText.toLowerCase()))
                );

                if (filterText && matchingDisorders.length === 0) return;

                const categoryDiv = document.createElement("div");
                categoryDiv.className = "tree-category open"; // Domyślnie otwarte

                const headerDiv = document.createElement("div");
                headerDiv.className = "tree-category-header";
                headerDiv.innerHTML = `<span>${cat.name}</span> <span class="toggle-icon">&#9658;</span>`;
                headerDiv.onclick = () => {
                    categoryDiv.classList.toggle("open");
                };

                const bodyDiv = document.createElement("div");
                bodyDiv.className = "tree-category-body";

                const disordersToDisplay = filterText ? matchingDisorders : icd11Database.filter(d => cat.codes.includes(d.code));

                disordersToDisplay.forEach(disorder => {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = `disorder-item ${currentDisorder && currentDisorder.code === disorder.code ? 'active' : ''}`;
                    itemDiv.innerHTML = `
                        <div class="item-code">${disorder.code}</div>
                        <div class="item-title">${disorder.title}</div>
                    `;
                    itemDiv.onclick = (e) => {
                        e.stopPropagation();
                        selectDisorder(disorder);
                    };
                    bodyDiv.appendChild(itemDiv);
                });

                categoryDiv.appendChild(headerDiv);
                categoryDiv.appendChild(bodyDiv);
                container.appendChild(categoryDiv);
            });
        }

        function selectDisorder(disorder) {
            currentDisorder = disorder;
            renderTree(document.getElementById("searchInput").value);

            document.getElementById("disorderTitle").innerText = disorder.title;
            document.getElementById("disorderMeta").innerText = `Kod: ${disorder.code} | Kategoria: ${disorder.category} | Oficjalna klasyfikacja ICD-11 MMS`;

            const container = document.getElementById("criteriaContainer");
            container.innerHTML = "";

            const req = disorder.diagnosticRequirements;

            // Karta Czasu trwania
            const durCard = document.createElement("div");
            durCard.className = "section-card";
            durCard.innerHTML = `
                <h3 class="section-title">Czas trwania i początek objawów</h3>
                <p class="section-desc">${req.duration.description}</p>
                <label class="checkbox-label">
                    <input type="checkbox" id="checkDuration" onchange="validateCriteria()">
                    <span><strong>Spełniono kryterium czasu trwania</strong> (wymagane min. ${req.duration.minDays} dni / odpowiedni okres rozwojowy)</span>
                </label>
            `;
            container.appendChild(durCard);

            // Karta Objawów osiowych
            if (req.coreSymptoms && req.coreSymptoms.items.length > 0) {
                const coreCard = document.createElement("div");
                coreCard.className = "section-card";
                coreCard.innerHTML = `
                    <h3 class="section-title">${req.coreSymptoms.description}</h3>
                    <p class="section-desc">Wymagane minimum: ${req.coreSymptoms.minRequired}</p>
                    <div class="checkbox-group" id="coreGroup">
                        ${req.coreSymptoms.items.map((item, idx) => `
                            <label class="checkbox-label">
                                <input type="checkbox" class="core-checkbox" data-id="${item.id}" onchange="validateCriteria()">
                                <span>${item.text}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(coreCard);
            }

            // Karta Objawów dodatkowych
            if (req.additionalSymptoms && req.additionalSymptoms.items.length > 0) {
                const addCard = document.createElement("div");
                addCard.className = "section-card";
                addCard.innerHTML = `
                    <h3 class="section-title">${req.additionalSymptoms.description}</h3>
                    <p class="section-desc">Wymagane minimum: ${req.additionalSymptoms.minRequired}</p>
                    <div class="checkbox-group" id="addGroup">
                        ${req.additionalSymptoms.items.map((item, idx) => `
                            <label class="checkbox-label">
                                <input type="checkbox" class="add-checkbox" data-id="${item.id}" onchange="validateCriteria()">
                                <span>${item.text}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(addCard);
            }

            // Karta Upośledzenia funkcjonowania
            const impCard = document.createElement("div");
            impCard.className = "section-card";
            impCard.innerHTML = `
                <h3 class="section-title">Wpływ na funkcjonowanie i cierpienie</h3>
                <p class="section-desc">${req.impairment}</p>
                <label class="checkbox-label">
                    <input type="checkbox" id="checkImpairment" onchange="validateCriteria()">
                    <span><strong>Spełniono kryterium klinicznego dystresu lub upośledzenia funkcjonowania</strong> w sferze osobistej, rodzinnej, społecznej lub zawodowej</span>
                </label>
            `;
            container.appendChild(impCard);

            document.getElementById("footerPanel").style.display = "flex";
            validateCriteria();
        }

        function validateCriteria() {
            if (!currentDisorder) return;
            const req = currentDisorder.diagnosticRequirements;

            const durChecked = document.getElementById("checkDuration").checked;
            const impChecked = document.getElementById("checkImpairment").checked;

            let coreValid = true;
            const coreCheckboxes = document.querySelectorAll(".core-checkbox");
            if (coreCheckboxes.length > 0) {
                const checkedCore = Array.from(coreCheckboxes).filter(cb => cb.checked).length;
                coreValid = checkedCore >= req.coreSymptoms.minRequired;
            }

            let addValid = true;
            const addCheckboxes = document.querySelectorAll(".add-checkbox");
            if (addCheckboxes.length > 0) {
                const checkedAdd = Array.from(addCheckboxes).filter(cb => cb.checked).length;
                addValid = checkedAdd >= req.additionalSymptoms.minRequired;
            }

            const isComplete = durChecked && impChecked && coreValid && addValid;

            const badge = document.getElementById("statusBadge");
            if (isComplete) {
                badge.className = "status-badge complete";
                badge.innerText = "Kryteria diagnostyczne ICD-11 spełnione";
            } else {
                badge.className = "status-badge incomplete";
                badge.innerText = "Kryteria niespełnione (wymagane zaznaczenie wszystkich kryteriów)";
            }
        }

        function exportSummary() {
            if (!currentDisorder) return;
            const badge = document.getElementById("statusBadge");
            const statusText = badge.innerText;

            let summary = `DIAGNOZA ICD-11 (MMS - Zdrowie Psychiczne)\n`;
            summary += `Jednostka: ${currentDisorder.title}\n`;
            summary += `Kod ICD-11: ${currentDisorder.code}\n`;
            summary += `Kategoria: ${currentDisorder.category}\n`;
            summary += `Wynik weryfikacji kryteriów: ${statusText}\n`;
            summary += `Data: ${new Date().toLocaleDateString()}\n`;

            navigator.clipboard.writeText(summary).then(() => {
                alert("Podsumowanie diagnostyczne skopiowane do schowka!");
            });
        }

        document.getElementById("searchInput").addEventListener("input", (e) => {
            renderTree(e.target.value);
        });

        // Inicjalizacja drzewa
        renderTree();
    </script>
</body>
</html>
