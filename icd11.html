<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICD-11 Asystent Diagnostyczny</title>
    <style>
        :root {
            --primary: #2563eb;
            --surface: #ffffff;
            --background: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .disorder-title {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            color: var(--primary);
        }
        .disorder-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .section-title {
            font-size: 1.1rem;
            margin: 20px 0 10px 0;
            color: var(--text-main);
        }
        .section-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .checkbox-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .checkbox-item:hover {
            background: var(--background);
        }
        .checkbox-item input {
            margin-top: 4px;
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checkbox-item label {
            cursor: pointer;
            flex: 1;
        }
        .result-panel {
            position: sticky;
            bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s;
        }
        .status-incomplete {
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fca5a5;
        }
        .status-complete {
            background: #ecfdf5;
            color: var(--success);
            border: 1px solid #6ee7b7;
        }
        .req-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
            font-size: 0.9rem;
            font-weight: normal;
        }
        .req-list li { margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Asystent Diagnostyczny ICD-11</h1>
        <p>Wsparcie decyzji klinicznej (Decision Support Tool)</p>
    </div>

    <div class="card">
        <h2 class="disorder-title" id="d-title">Ładowanie...</h2>
        <div class="disorder-meta" id="d-meta"></div>

        <div id="criteria-container">
            <!-- Tutaj JS wygeneruje formularz -->
        </div>
    </div>

    <div id="result-panel" class="card result-panel status-incomplete">
        <div id="status-text">Analiza kryteriów...</div>
        <ul id="req-details" class="req-list"></ul>
    </div>
</div>

<script>
    // 1. Przykładowy obiekt JSON pobierany przez aplikację
    const disorderData = {
        "code": "6A20",
        "title": "Depresja jednorazowa (Single Episode Depressive Disorder)",
        "category": "Zaburzenia nastroju",
        "version": "ICD-11",
        "diagnosticRequirements": {
            "duration": {
                "minDays": 14,
                "description": "Objawy muszą utrzymywać się przez większość dnia, niemal codziennie, przez co najmniej 2 tygodnie."
            },
            "coreSymptoms": {
                "minRequired": 1,
                "description": "Musi wystąpić co najmniej jeden z głównych objawów:",
                "items": [
                    { "id": "core_1", "text": "Obniżony nastrój niemal codziennie przez większość dnia" },
                    { "id": "core_2", "text": "Znaczny spadek zainteresowań lub odczuwania przyjemności (anhedonia)" }
                ]
            },
            "additionalSymptoms": {
                "minRequired": 3,
                "description": "Musi wystąpić co najmniej 3 dodatkowe objawy:",
                "items": [
                    { "id": "add_1", "text": "Trudności z koncentracją i podejmowaniem decyzji" },
                    { "id": "add_2", "text": "Poczucie nadmiernej lub nieuzasadnionej winy / niskiej samooceny" },
                    { "id": "add_3", "text": "Nawracające myśli o śmierci lub samobójstwie" },
                    { "id": "add_4", "text": "Zaburzenia snu (bezsenność lub nadmierna senność)" },
                    { "id": "add_5", "text": "Znaczne zmiany apetytu lub masy ciała" },
                    { "id": "add_6", "text": "Pobudzenie lub spowolnienie psychoruchowe" },
                    { "id": "add_7", "text": "Zmęczenie lub znaczny spadek energii" }
                ]
            },
            "functionalImpairment": {
                "required": true,
                "description": "Objawy powodują istotne cierpienie lub upośledzenie w funkcjonowaniu osobistym, rodzinnym, społecznym lub zawodowym."
            }
        }
    };

    // 2. Funkcja budująca interfejs na podstawie JSON
    function renderChecklist() {
        document.getElementById('d-title').innerText = `[${disorderData.code}] ${disorderData.title}`;
        document.getElementById('d-meta').innerText = `Kategoria: ${disorderData.category} | Wersja: ${disorderData.version}`;

        const container = document.getElementById('criteria-container');
        let html = '';

        const reqs = disorderData.diagnosticRequirements;

        // Sekcja: Ramy czasowe
        html += `
            <h3 class="section-title">Ramy czasowe</h3>
            <div class="checkbox-item">
                <input type="checkbox" id="chk_duration" class="criteria-checkbox">
                <label for="chk_duration">${reqs.duration.description}</label>
            </div>
        `;

        // Sekcja: Objawy osiowe
        html += `
            <h3 class="section-title">Objawy osiowe (min. ${reqs.coreSymptoms.minRequired})</h3>
            <div class="section-desc">${reqs.coreSymptoms.description}</div>
        `;
        reqs.coreSymptoms.items.forEach(item => {
            html += `
                <div class="checkbox-item">
                    <input type="checkbox" id="${item.id}" data-type="core" class="criteria-checkbox">
                    <label for="${item.id}">${item.text}</label>
                </div>
            `;
        });

        // Sekcja: Objawy dodatkowe
        html += `
            <h3 class="section-title">Objawy dodatkowe (min. ${reqs.additionalSymptoms.minRequired})</h3>
            <div class="section-desc">${reqs.additionalSymptoms.description}</div>
        `;
        reqs.additionalSymptoms.items.forEach(item => {
            html += `
                <div class="checkbox-item">
                    <input type="checkbox" id="${item.id}" data-type="add" class="criteria-checkbox">
                    <label for="${item.id}">${item.text}</label>
                </div>
            `;
        });

        // Sekcja: Funkcjonowanie
        if(reqs.functionalImpairment.required) {
            html += `
                <h3 class="section-title">Wpływ na funkcjonowanie</h3>
                <div class="checkbox-item">
                    <input type="checkbox" id="chk_impairment" class="criteria-checkbox">
                    <label for="chk_impairment">${reqs.functionalImpairment.description}</label>
                </div>
            `;
        }

        container.innerHTML = html;

        // Podepnij nasłuchiwanie zdarzeń
        document.querySelectorAll('.criteria-checkbox').forEach(chk => {
            chk.addEventListener('change', validateCriteria);
        });

        // Wstępna walidacja (wszystko puste na start)
        validateCriteria();
    }

    // 3. Funkcja walidująca w czasie rzeczywistym
    function validateCriteria() {
        const reqs = disorderData.diagnosticRequirements;
        
        // Zliczanie zaznaczonych elementów
        const coreChecked = document.querySelectorAll('input[data-type="core"]:checked').length;
        const addChecked = document.querySelectorAll('input[data-type="add"]:checked').length;
        const durationChecked = document.getElementById('chk_duration').checked;
        const impairmentChecked = document.getElementById('chk_impairment') ? document.getElementById('chk_impairment').checked : true;

        // Sprawdzanie warunków
        const coreMet = coreChecked >= reqs.coreSymptoms.minRequired;
        const addMet = addChecked >= reqs.additionalSymptoms.minRequired;
        
        const isComplete = coreMet && addMet && durationChecked && impairmentChecked;

        // Aktualizacja UI (Panel wyników)
        const panel = document.getElementById('result-panel');
        const statusText = document.getElementById('status-text');
        const reqDetails = document.getElementById('req-details');

        if (isComplete) {
            panel.className = 'card result-panel status-complete';
            statusText.innerText = 'Kryteria diagnostyczne zostały wstępnie spełnione';
            reqDetails.innerHTML = '<li>Pamiętaj o weryfikacji wykluczeń i diagnozy różnicowej przed podjęciem ostatecznej decyzji.</li>';
        } else {
            panel.className = 'card result-panel status-incomplete';
            statusText.innerText = 'Kryteria diagnostyczne NIE są w pełni spełnione';
            
            let detailsHtml = '';
            if (!durationChecked) detailsHtml += '<li>❌ Brak potwierdzenia minimalnego czasu trwania objawów.</li>';
            if (!coreMet) detailsHtml += `<li>❌ Zaznaczono ${coreChecked}/${reqs.coreSymptoms.minRequired} wymaganych objawów osiowych.</li>`;
            if (!addMet) detailsHtml += `<li>❌ Zaznaczono ${addChecked}/${reqs.additionalSymptoms.minRequired} wymaganych objawów dodatkowych.</li>`;
            if (!impairmentChecked) detailsHtml += '<li>❌ Brak potwierdzenia wpływu na funkcjonowanie pacjenta.</li>';
            
            reqDetails.innerHTML = detailsHtml;
        }
    }

    // Start aplikacji
    window.onload = renderChecklist;
</script>

</body>
</html>
